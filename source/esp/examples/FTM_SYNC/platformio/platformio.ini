; FTS (FineTimeSync) sobre PlatformIO + ESP-IDF, placas YD-ESP32-S3 N16R8
; (identificacion provisional). Un entorno por rol/placa; cada uno tiene su
; propio sdkconfig.<entorno> generado, nunca compartido.
[platformio]
default_envs = master
src_dir = src

[env]
platform = espressif32@6.13.0
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
extra_scripts = pre:scripts/pio_env_guard.py
                post:scripts/pio_verify_sdkconfig.py

[env:master]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;profiles/role_master.defaults;profiles/env_master.defaults"
custom_fts_role = master

[env:slave1]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;profiles/role_slave.defaults;profiles/env_slave1.defaults"
custom_fts_role = slave

[env:slave2]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;profiles/role_slave.defaults;profiles/env_slave2.defaults"
custom_fts_role = slave

[env:slave3]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;profiles/role_slave.defaults;profiles/env_slave3.defaults"
custom_fts_role = slave

[env:slave4]
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;profiles/role_slave.defaults;profiles/env_slave4.defaults"
custom_fts_role = slave
